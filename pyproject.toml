[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rushhour"
version = "1.0.0"
description = "A congestion-aware urban traffic assignment simulator and interactive showcase."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "matplotlib>=3.7",
    "networkx>=3.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "pymupdf>=1.24",
    "streamlit>=1.50",
    "streamlit-drawable-canvas>=0.9.3",
]

[project.optional-dependencies]
osm = ["osmnx>=1.9"]
gis = ["geopandas>=1.0", "pyogrio>=0.9", "shapely>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
rushhour = "rushhour.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
